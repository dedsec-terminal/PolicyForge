name: Sync docs and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync markdown files into docs/
        run: |
          mkdir -p docs/policies docs/mapping docs/register docs/context
          cp README.md              docs/README.md
          cp policies/*.md          docs/policies/
          cp mapping/control-traceability-matrix.md docs/mapping/
          cp mapping/ctm_audit_report.md            docs/mapping/
          cp register/exception-log.md              docs/register/
          cp register/review-cadence-tracker.md     docs/register/
          cp context/org-profile.md                 docs/context/

      - name: Commit synced files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: sync markdown files into docs/ [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
