name: Deploy PolicyForge Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/policies _site/mapping _site/register _site/context
          cp docs/index.html        _site/index.html
          cp README.md              _site/README.md
          cp policies/*.md          _site/policies/
          cp mapping/*.md           _site/mapping/
          cp register/*.md          _site/register/
          cp context/*.md           _site/context/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
